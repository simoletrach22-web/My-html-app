<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Zombie Game - لعبة الزومبي</title>
  
  <!-- هادو هما المهمين باش يولّي PWA -->
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#000000">
  <link rel="icon" href="./icon-192.png" type="image/png">

  <style>
    body { background: #000; color: #fff; text-align: center; font-family: Arial; }
    canvas { background: #111; border: 2px solid red; }
    h1 { color: red; }
  </style>
</head>
<body>
  <h1>🧟‍♂️ Zombie Game 🧟‍♂️</h1>
  <canvas id="game" width="400" height="600"></canvas>
  
  <script>
    // هنا الكود ديال اللعبة ديالك
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = "white";
    ctx.font = "20px Arial";
    ctx.fillText("مرحبا ف لعبة الزومبي", 80, 300);
  </script>
</body>
</html>
