<!DOCTYPE html>
<html>
<body style="background:#000; text-align:center">
<canvas id="c512" width="512" height="512"></canvas>
<canvas id="c192" width="192" height="192" style="margin-top:20px"></canvas>
<script>
function draw(canvas, size){
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = "#000";
  ctx.fillRect(0,0,size);
  ctx.font = size*0.8 + "px Arial";
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";
  ctx.fillText("🧟‍♂️", size/2, size/2);
}
draw(document.getElementById('c512'), 512);
draw(document.getElementById('c192'), 192);
</script>
</body>
</html>
